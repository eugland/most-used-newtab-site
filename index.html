<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Chrome extensions by eugland — private, local, no tracking.">
  <title>Apps by eugland</title>
  <style>
    :root{
      color-scheme:light dark;
      --bg:#f6f7f9; --surface:#ffffff; --border:#e2e6ee;
      --ink:#202124; --muted:#5f6368;
      --shadow:0 10px 30px rgba(20,40,80,.10);
      font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    }
    @media(prefers-color-scheme:dark){
      :root{--bg:#202124;--surface:#2b2c2f;--border:#3c4043;--ink:#e8eaed;--muted:#bdc1c6;--shadow:0 10px 30px rgba(0,0,0,.35)}
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink)}
    a{text-decoration:none;color:inherit}
    .wrap{max-width:820px;margin:0 auto;padding:0 24px}
    header{padding:72px 0 40px;text-align:center}
    h1{font-size:clamp(2rem,6vw,3rem);letter-spacing:-.04em;margin:0 0 12px}
    .lead{color:var(--muted);font-size:1.1rem;margin:0}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;padding-bottom:64px}
    .app{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;transition:transform .12s,box-shadow .12s}
    .app:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
    .app img{width:56px;height:56px;border-radius:14px;flex:none}
    .app h2{margin:0 0 4px;font-size:1.15rem}
    .app p{margin:0;color:var(--muted);font-size:.95rem}
    footer{border-top:1px solid var(--border);padding:32px 0 56px;text-align:center;color:var(--muted);font-size:.9rem}
    footer a{margin:0 10px;color:var(--muted)}
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Apps by eugland</h1>
      <p class="lead">Chrome extensions that run locally on your device. No accounts, no tracking.</p>
    </div>
  </header>
  <main class="wrap">
    <div class="grid">
      <a class="app" href="new-tab/index.html">
        <img src="new-tab/images/icon-128.png" alt="New Tab icon">
        <div>
          <h2>New Tab: More Recent Visited</h2>
          <p>A new tab that ranks the sites you visit most, computed locally.</p>
        </div>
      </a>
      <a class="app" href="wechat/index.html">
        <img src="wechat/images/wx-icon-128.png" alt="WeChat Image Downloader icon">
        <div>
          <h2>WeChat Image Downloader</h2>
          <p>One-click download of every image from a WeChat post.</p>
        </div>
      </a>
    </div>
  </main>
  <footer>
    <div class="wrap">
      <a href="https://github.com/eugland/apps">GitHub</a>
      <p>© 2026 eugland</p>
    </div>
  </footer>
</body>
</html>
